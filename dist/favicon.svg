<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favHeartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0047AB"/>
      <stop offset="60%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#7B5EA7"/>
    </linearGradient>
    <linearGradient id="favSkyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#A5DBF5"/>
    </linearGradient>
    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="rgba(18, 38, 66, 0.25)"/>
    </filter>
  </defs>

  <!-- Fondo circular para contraste perfecto en pestañas oscuras y claras -->
  <circle cx="32" cy="32" r="30" fill="#F7F5F0" stroke="#87CEEB" stroke-width="2"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#7B5EA7" stroke-width="1" stroke-dasharray="3 3" opacity="0.45"/>

  <!-- Ondas suaves de fondo del mundo azul -->
  <path d="M 8 26 Q 20 18, 32 26 T 56 26" stroke="#87CEEB" stroke-width="1.8" fill="none" opacity="0.75" stroke-linecap="round"/>
  <path d="M 8 40 Q 20 48, 32 40 T 56 40" stroke="#7B5EA7" stroke-width="1.6" fill="none" opacity="0.65" stroke-linecap="round"/>

  <!-- Corazón tejido de Hilos Azules -->
  <g filter="url(#favShadow)">
    <!-- Rama izquierda tejida (puntadas de crochet) -->
    <path d="M 32 21 C 28 8, 11 8, 11 25 C 11 38, 25 45, 32 53" 
          stroke="url(#favHeartGrad)" stroke-width="3.6" stroke-linecap="round" fill="none"/>
    <path d="M 32 21 C 28 8, 11 8, 11 25 C 11 38, 25 45, 32 53" 
          stroke="#87CEEB" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round" fill="none"/>

    <!-- Rama derecha tejida -->
    <path d="M 32 21 C 36 8, 53 8, 53 25 C 53 38, 39 45, 32 53" 
          stroke="url(#favHeartGrad)" stroke-width="3.6" stroke-linecap="round" fill="none"/>
    <path d="M 33 21 C 37 10, 51 10, 51 25 C 51 37, 38 44, 32.5 52" 
          stroke="#7B5EA7" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Nudos de crochet arriba y abajo -->
    <circle cx="32" cy="21" r="2.8" fill="#1E3A5F"/>
    <circle cx="32" cy="21" r="1.2" fill="#87CEEB"/>
    <circle cx="32" cy="53" r="2.8" fill="#1E3A5F"/>
    <circle cx="32" cy="53" r="1.2" fill="#87CEEB"/>
  </g>
</svg>
